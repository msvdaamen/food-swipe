name: Monorepo CI/CD

run-name: ${{ github.event_name }} · ${{ github.ref_name }}

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend API
    uses: ./.github/workflows/backend.yml

  admin:
    name: Admin Web
    uses: ./.github/workflows/admin.yml

  migrate:
    name: Database / Migrate
    needs: [backend, admin]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @food-swipe/backend...

      - name: Run migrations
        run: pnpm --filter @food-swipe/backend migrate

  deploy_backend:
    name: Backend API / Deploy
    needs: [backend, admin, migrate]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @food-swipe/backend...

      - name: Deploy backend
        run: pnpm --filter @food-swipe/backend deploy

  deploy_admin:
    name: Admin Web / Deploy
    needs: [backend, admin, migrate]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @food-swipe/admin...

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: admin-dist
          path: apps/admin

      - name: Deploy admin
        run: pnpm --filter @food-swipe/admin deploy
